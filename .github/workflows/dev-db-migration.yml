name: Approved Dev database migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run read-only connectivity diagnostics or the separately approved one-time migration.
        required: true
        type: choice
        options:
          - diagnostic
          - migration
        default: migration
      confirmation:
        description: Type DIAGNOSE helpdesk-dev-gke or RUN helpdesk-dev-schema-001 for the selected mode.
        required: true
        type: string
        default: DO NOT RUN

permissions:
  contents: read

concurrency:
  group: helpdesk-dev-schema-001
  cancel-in-progress: false

env:
  PROJECT_ID: helpdeskcloud-capstone-511905
  REGION: us-east1
  CLUSTER: helpdeskcloud-dev-gke
  NAMESPACE: helpdesk-dev
  PROXY_IMAGE: us-east1-docker.pkg.dev/helpdeskcloud-capstone-511905/helpdeskcloud-dev-images/cloud-sql-proxy
  MIGRATION_IMAGE: us-east1-docker.pkg.dev/helpdeskcloud-capstone-511905/helpdeskcloud-dev-images/postgres-client
  JOB_NAME: helpdesk-dev-schema-001

jobs:
  preflight:
    name: Check diagnostic or migration dispatch gates
    if: github.repository == 'mhachem110/HelpDeskCloud-App'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unapproved refs and dispatches
        env:
          ENABLED: ${{ vars.DEV_DB_MIGRATION_ENABLED }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/dev' ]] || { echo '::error::Database migration is limited to the protected dev branch.'; exit 1; }
          [[ "$GITHUB_REPOSITORY" == 'mhachem110/HelpDeskCloud-App' ]] || { echo '::error::Unexpected repository.'; exit 1; }
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] || { echo '::error::This workflow is manual-only.'; exit 1; }
          case "$MODE" in
            diagnostic)
              [[ "$CONFIRMATION" == 'DIAGNOSE helpdesk-dev-gke' ]] || { echo '::error::Type the exact diagnostic confirmation to continue.'; exit 1; }
              ;;
            migration)
              [[ "$ENABLED" == 'true' ]] || { echo '::error::Set DEV_DB_MIGRATION_ENABLED=true only after reviewing all prerequisites.'; exit 1; }
              [[ "$CONFIRMATION" == 'RUN helpdesk-dev-schema-001' ]] || { echo '::error::Type the exact migration confirmation to continue.'; exit 1; }
              ;;
            *)
              echo '::error::Choose diagnostic or migration mode.'
              exit 1
              ;;
          esac

  render:
    name: Lint and render the one-time Job without cloud credentials
    needs: preflight
    if: inputs.mode == 'migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Check approved image digest inputs
        env:
          PROXY_DIGEST: ${{ vars.DEV_PROXY_IMAGE_DIGEST }}
          CLIENT_DIGEST: ${{ vars.DEV_MIGRATION_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          [[ "$PROXY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::DEV_PROXY_IMAGE_DIGEST is missing or invalid.'; exit 1; }
          [[ "$CLIENT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::DEV_MIGRATION_IMAGE_DIGEST is missing or invalid.'; exit 1; }
      - name: Lint and render only the reviewed migration Job
        env:
          PROXY_DIGEST: ${{ vars.DEV_PROXY_IMAGE_DIGEST }}
          CLIENT_DIGEST: ${{ vars.DEV_MIGRATION_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          helm lint helm/helpdesk -f helm/helpdesk/values-dev.yaml \
            --set application.enabled=false --set migration.enabled=true \
            --set-string cloudSqlProxy.image.digest="$PROXY_DIGEST" \
            --set-string migration.image.digest="$CLIENT_DIGEST"
          mkdir -p "$RUNNER_TEMP/dev-migration"
          helm template helpdesk helm/helpdesk --namespace "$NAMESPACE" \
            -f helm/helpdesk/values-dev.yaml \
            --set application.enabled=false --set migration.enabled=true \
            --set-string cloudSqlProxy.image.digest="$PROXY_DIGEST" \
            --set-string migration.image.digest="$CLIENT_DIGEST" \
            --show-only templates/migration-job.yaml \
            > "$RUNNER_TEMP/dev-migration/job.yaml"
          grep -Fq "${PROXY_IMAGE}@${PROXY_DIGEST}" "$RUNNER_TEMP/dev-migration/job.yaml"
          grep -Fq "${MIGRATION_IMAGE}@${CLIENT_DIGEST}" "$RUNNER_TEMP/dev-migration/job.yaml"
          grep -Fq 'helpdesk-dev-schema-001' "$RUNNER_TEMP/dev-migration/job.yaml"
          grep -Fq 'helpdesk-dev-migrate' "$RUNNER_TEMP/dev-migration/job.yaml"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: approved-dev-migration-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/dev-migration/job.yaml
          retention-days: 1
          if-no-files-found: error

  execute:
    name: Read-only diagnostics or separately approved one-time schema migration
    needs: [preflight, render]
    if: ${{ always() && needs.preflight.result == 'success' && (inputs.mode == 'diagnostic' || needs.render.result == 'success') }}
    environment: dev-db-migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the protected Environment verifier
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4.3.0
        if: inputs.mode == 'migration'
        with:
          name: approved-dev-migration-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/dev-migration
      - name: Verify the required GitHub Environment before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT: dev-db-migration
        run: bash .github/scripts/verify-dev-environment.sh

      - uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-app-migration-dev
          service_account: helpdesk-app-migr-runner-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
      - name: Install the supported GKE authentication plugin
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'
          install_components: gke-gcloud-auth-plugin
      - name: Generate supported DNS-endpoint kubeconfig with the GKE exec plugin
        id: gke-plugin
        env:
          KUBECONFIG: ${{ runner.temp }}/helpdesk-dev-gke-kubeconfig
        run: |
          set -euo pipefail
          gcloud config set --quiet container/use_application_default_credentials true
          gcloud container clusters get-credentials "$CLUSTER" \
            --project "$PROJECT_ID" \
            --location "$REGION" \
            --dns-endpoint
      - name: Run read-only GKE connectivity preflight
        id: plugin-diagnostics
        env:
          KUBECONFIG_PATH: ${{ runner.temp }}/helpdesk-dev-gke-kubeconfig
          AUTH_METHOD: gke-gcloud-auth-plugin
        continue-on-error: ${{ inputs.mode == 'diagnostic' }}
        run: python3 .github/scripts/diagnose-dev-migration-connectivity.py
      - name: Finish diagnostics without entering the migration path
        if: ${{ always() && inputs.mode == 'diagnostic' }}
        env:
          PLUGIN_RESULT: ${{ steps.plugin-diagnostics.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## Dev GKE migration connectivity diagnostics'
            echo
            echo "GKE DNS endpoint connectivity check: ${PLUGIN_RESULT:-not-run}."
            echo 'Checks are read-only. No Kubernetes resources were changed and no migration Job or SQL was executed.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PLUGIN_RESULT" != success ]]; then
            echo '::error::The read-only GKE connectivity check failed. See sanitized diagnostics above.'
            exit 1
          fi
      - name: Recheck target and bootstrap objects with the approved identity
        if: inputs.mode == 'migration'
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/helpdesk-dev-gke-kubeconfig"
          test "$(kubectl config current-context)" = "gke_${PROJECT_ID}_${REGION}_${CLUSTER}"
          kubectl get serviceaccount helpdesk-dev-migrate --namespace "$NAMESPACE" >/dev/null
          kubectl get secretproviderclass helpdesk-dev-db-admin --namespace "$NAMESPACE" >/dev/null
          kubectl get configmap helpdesk-dev-schema-001 --namespace "$NAMESPACE" >/dev/null
      - name: Dry-run and create the Job once; never replace an existing Job
        if: inputs.mode == 'migration'
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/helpdesk-dev-gke-kubeconfig"
          manifest="$RUNNER_TEMP/dev-migration/job.yaml"
          kubectl create --dry-run=server --namespace "$NAMESPACE" -f "$manifest" >/dev/null
          if existing=$(kubectl get job "$JOB_NAME" --namespace "$NAMESPACE" -o name 2>&1); then
            echo "::error::${JOB_NAME} already exists; inspect its status and do not rerun the migration."
            exit 1
          elif ! grep -qi 'not found' <<<"$existing"; then
            echo '::error::Could not prove the migration Job is absent.'
            printf '%s\n' "$existing"
            exit 1
          fi
          kubectl create --namespace "$NAMESPACE" -f "$manifest"
          if ! kubectl wait --namespace "$NAMESPACE" --for=condition=complete "job/${JOB_NAME}" --timeout=10m; then
            kubectl get job "$JOB_NAME" --namespace "$NAMESPACE" -o wide || true
            kubectl logs --namespace "$NAMESPACE" "job/${JOB_NAME}" -c migrate --all-pods=true || true
            echo '::error::Migration Job did not complete; preserve it for review and do not rerun blindly.'
            exit 1
          fi
          kubectl logs --namespace "$NAMESPACE" "job/${JOB_NAME}" -c migrate --all-pods=true
          echo "Completed one-time Job ${JOB_NAME} in ${NAMESPACE}." >> "$GITHUB_STEP_SUMMARY"
