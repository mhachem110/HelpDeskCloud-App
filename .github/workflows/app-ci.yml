name: Application CI

# Run repository checks for pull requests, branch promotions, and manual validation requests.
on:
  pull_request:
    branches: [dev, stage, prod]
  push:
    branches: [dev, stage, prod]
  workflow_dispatch:

# CI needs repository read access only; no cloud credentials or deployment permissions are granted.
permissions:
  contents: read

# Cancel stale CI on the same branch because these jobs only validate source and publish no artifacts.
# Cancel older validation on the same workflow/ref so newer commits get the available runner time.
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reject pull requests that do not follow the agreed feature -> dev -> stage -> prod path.
  promotion-route:
    name: Check promotion route
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require reviewed branch progression
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "${BASE}:${HEAD}" in
            dev:feature/*|stage:dev|prod:stage) echo 'Promotion route accepted.' ;;
            *) echo '::error::Only feature/* → dev → stage → prod is allowed.'; exit 1 ;;
          esac

  # Always run scope detection and secret scanning; expose flags for the heavier validation jobs.
  changes:
    name: Detect validation scope and scan repository secrets
    # Keep this workflow-level trigger broad so required PR checks always start; skip only jobs.
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.scope.outputs.dotnet }}
      container: ${{ steps.scope.outputs.container }}
      helm: ${{ steps.scope.outputs.helm }}
    steps:
      - name: Check out complete event history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks for changed files
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/detect-ci-scope.py app-ci "$GITHUB_OUTPUT"
      - name: Scan repository for committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  # Build and test .NET only when the changed-file classifier selects application code.
  validate:
    name: Build and validate .NET
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build and test the reviewed application source
        run: bash .github/scripts/verify-dotnet.sh

  # Build and scan the container locally in CI; this job does not publish an image.
  docker:
    name: Build container image
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build image (no cloud credentials)
        run: docker build --tag helpdeskcloud:ci .
      - name: Scan container for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helpdeskcloud:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: CRITICAL
  # Lint, render, and schema-check Helm resources when chart inputs changed.
  helm:
    name: Validate Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Set up Go for Kubernetes schema validation
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Install pinned Kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: Install YAML parser for manifest tests
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Lint and render chart
        run: |
          set -euo pipefail
          helm lint helm/helpdesk --set image.repository=example.invalid/helpdesk
          helm lint helm/helpdesk -f helm/helpdesk/values-dev.yaml --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --set cloudSqlProxy.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          helm template helpdesk helm/helpdesk -n helpdesk-dev -f helm/helpdesk/values-dev.yaml \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set cloudSqlProxy.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb > /tmp/helpdesk-dev.yaml
          helm template helpdesk helm/helpdesk -n helpdesk-dev -f helm/helpdesk/values-dev.yaml \
            --set application.enabled=false --set migration.enabled=true \
            --set cloudSqlProxy.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set migration.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc > /tmp/helpdesk-migration.yaml
          helm template helpdesk helm/helpdesk -n helpdesk-dev -f helm/helpdesk/values-dev.yaml \
            -f helm/helpdesk/values-dev-delivery.yaml \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set cloudSqlProxy.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb > /tmp/helpdesk-release.yaml
          python .github/scripts/check-private-release.py /tmp/helpdesk-release.yaml
          helm lint helm/https-edge-access
          for stage in health-only application; do
            helm template helpdesk-edge helm/https-edge-access -n helpdesk-dev \
              --set enabled=true --set-string "stage=$stage" --set-string hostname=dev.example.com \
              --set-string certificateMap=helpdesk-dev-cert-map --set-string staticIpName=helpdesk-dev-https-ip \
              --set-string sslPolicyName=helpdesk-dev-tls \
              --set-string oauthClientId=123456789012-abc.apps.googleusercontent.com \
              > "/tmp/helpdesk-edge-${stage}.yaml"
            python .github/scripts/check-https-edge.py "/tmp/helpdesk-edge-${stage}.yaml" \
              "$stage" dev.example.com helpdesk-dev-cert-map helpdesk-dev-https-ip helpdesk-dev-tls \
              123456789012-abc.apps.googleusercontent.com
          done
          "$(go env GOPATH)/bin/kubeconform" -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 /tmp/helpdesk-dev.yaml /tmp/helpdesk-migration.yaml /tmp/helpdesk-release.yaml /tmp/helpdesk-edge-health-only.yaml /tmp/helpdesk-edge-application.yaml k8s/dev-delivery-rbac.yaml k8s/dev-migration-runner-rbac.yaml
          python -m unittest discover -s tests -p 'test_*.py' -v
