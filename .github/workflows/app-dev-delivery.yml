name: Application Dev delivery

# Dev delivery is path-filtered on push; manual dispatch can request an ordinary release or an HTTPS stage.
on:
  push:
    branches: [dev]
    # Release only when a runtime image or the reviewed app deployment inputs change.
    # workflow_dispatch remains available for an owner-reviewed redeploy.
    paths:
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - "helm/helpdesk/**"
      - "helm/https-edge-access/**"
      - ".github/scripts/check-https-edge.py"
      - ".github/scripts/check-private-release.py"
      - ".github/scripts/verify-dev-environment.sh"
  workflow_dispatch:
    inputs:
      https_stage:
        description: HTTPS edge stage. Leave at none for ordinary app delivery.
        required: true
        type: choice
        options: [none, health-only, application]
        default: none
      confirm_application_route:
        description: Confirm that the app's IAP assertion enforcement and the exact IAP user grant were verified before routing ticket paths.
        required: true
        type: boolean
        default: false

# Keep repository access read-only by default; approved cloud jobs request OIDC explicitly.
permissions:
  contents: read

# Keep package, publish, deploy, and HTTPS operations serialized for this Dev target.
concurrency:
  group: application-dev-delivery
  cancel-in-progress: false

# Dev destination and image names shared by the package, publish, and deploy jobs.
env:
  PROJECT_ID: helpdeskcloud-capstone-511905
  REGION: us-east1
  CLUSTER: helpdeskcloud-dev-gke
  NAMESPACE: helpdesk-dev
  IMAGE_REPOSITORY: us-east1-docker.pkg.dev/helpdeskcloud-capstone-511905/helpdeskcloud-dev-images/helpdeskcloud

jobs:
  # Test, build and scan one immutable image from the triggering commit, then pass that exact archive forward.
  package:
    name: Test, build and scan reviewed source
    if: github.repository == 'mhachem110/HelpDeskCloud-App' && github.ref == 'refs/heads/dev' && vars.DEV_APP_CD_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.https_stage == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build and test the reviewed release source
        run: bash .github/scripts/verify-dotnet.sh
      - name: Build one Linux image from this commit
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --tag helpdeskcloud:reviewed .
          test "$(docker image inspect helpdeskcloud:reviewed --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
      - name: Block fixable critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helpdeskcloud:reviewed
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: CRITICAL
      - name: Save the scanned image for the publisher
        run: docker save helpdeskcloud:reviewed -o "$RUNNER_TEMP/helpdeskcloud.tar"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: reviewed-helpdesk-image
          path: ${{ runner.temp }}/helpdeskcloud.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Publish the scanned archive with a commit/run tag and record the resulting registry digest.
  publish:
    name: Approved Dev image publication
    needs: package
    if: needs.package.result == 'success'
    environment: dev-app-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Verify protected publishing Environment before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT: dev-app-publish
        run: bash .github/scripts/verify-dev-environment.sh
      - uses: actions/download-artifact@v4.3.0
        with:
          name: reviewed-helpdesk-image
          path: ${{ runner.temp }}
      - name: Load the exact scanned image
        run: docker load -i "$RUNNER_TEMP/helpdeskcloud.tar"
      # These dedicated app identities do not exist until separately approved.
      - uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-app-publish-dev
          service_account: helpdesk-app-publisher-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push commit-tagged image and resolve registry digest
        id: image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="${IMAGE_REPOSITORY}:${tag}"
          docker tag helpdeskcloud:reviewed "$image"
          docker push "$image"
          digest=$(gcloud artifacts docker images describe "$image" --project="$PROJECT_ID" --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Registry did not return a valid image digest.'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published ${image}@${digest}" >> "$GITHUB_STEP_SUMMARY"

  # Deploy only the digest produced above, after protected-environment approval and release validation.
  deploy:
    name: Approved Dev GKE deployment
    needs: publish
    if: needs.publish.result == 'success'
    environment: dev-app-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Verify protected deployment Environment before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT: dev-app-deploy
        run: bash .github/scripts/verify-dev-environment.sh
      - name: Verify immutable image inputs
        env:
          APP_DIGEST: ${{ needs.publish.outputs.image_digest }}
          PROXY_DIGEST: ${{ vars.DEV_PROXY_IMAGE_DIGEST }}
          HTTPS_ACTIVE: ${{ vars.DEV_HTTPS_ACTIVE }}
          IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
          IAP_BACKEND_SERVICE_ID: ${{ vars.DEV_IAP_BACKEND_SERVICE_ID }}
        run: |
          set -euo pipefail
          [[ "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PROXY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Approved proxy image digest is missing or invalid.'; exit 1; }
          if [[ "$HTTPS_ACTIVE" == 'true' ]]; then
            [[ "$IAP_BACKEND_SERVICE_ID" =~ ^[0-9]+$ ]] || { echo '::error::HTTPS is active but DEV_IAP_BACKEND_SERVICE_ID is missing or invalid.'; exit 1; }
            [[ "$IAP_ALLOWED_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]] || { echo '::error::HTTPS is active but DEV_IAP_ALLOWED_EMAIL is missing or invalid.'; exit 1; }
          fi
      - name: Install offline manifest validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-app-deploy-dev
          service_account: helpdesk-app-deployer-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          cluster_name: helpdeskcloud-dev-gke
          location: us-east1
          use_dns_based_endpoint: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@v4
      - name: Verify target and bootstrap resources
        run: |
          set -euo pipefail
          test "$(kubectl config current-context)" = "gke_${PROJECT_ID}_${REGION}_${CLUSTER}"
          kubectl get serviceaccount helpdesk-dev-app -n "$NAMESPACE" >/dev/null
          kubectl get secretproviderclass helpdesk-dev-db -n "$NAMESPACE" >/dev/null
      - name: Render and validate exact digest-pinned release
        env:
          APP_DIGEST: ${{ needs.publish.outputs.image_digest }}
          PROXY_DIGEST: ${{ vars.DEV_PROXY_IMAGE_DIGEST }}
          HTTPS_ACTIVE: ${{ vars.DEV_HTTPS_ACTIVE }}
          IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
          IAP_BACKEND_SERVICE_ID: ${{ vars.DEV_IAP_BACKEND_SERVICE_ID }}
        run: |
          set -euo pipefail
          iap_args=(--set iap.enabled=false)
          if [[ "$HTTPS_ACTIVE" == 'true' ]]; then
            audience="/projects/260283083469/global/backendServices/${IAP_BACKEND_SERVICE_ID}"
            iap_args=(--set iap.enabled=true --set-string "iap.expectedAudience=$audience" --set-string "iap.allowedEmail=$IAP_ALLOWED_EMAIL")
          fi
          helm lint helm/helpdesk -f helm/helpdesk/values-dev.yaml -f helm/helpdesk/values-dev-delivery.yaml \
            --set-string image.digest="$APP_DIGEST" --set-string cloudSqlProxy.image.digest="$PROXY_DIGEST" "${iap_args[@]}"
          helm template helpdesk helm/helpdesk -n "$NAMESPACE" -f helm/helpdesk/values-dev.yaml -f helm/helpdesk/values-dev-delivery.yaml \
            --set-string image.digest="$APP_DIGEST" --set-string cloudSqlProxy.image.digest="$PROXY_DIGEST" \
            "${iap_args[@]}" \
            > "$RUNNER_TEMP/helpdesk-release.yaml"
          python .github/scripts/check-private-release.py "$RUNNER_TEMP/helpdesk-release.yaml"
          kubectl apply --dry-run=server -n "$NAMESPACE" -f "$RUNNER_TEMP/helpdesk-release.yaml" >/dev/null
      - name: Deploy and wait for two healthy replicas
        env:
          APP_DIGEST: ${{ needs.publish.outputs.image_digest }}
          PROXY_DIGEST: ${{ vars.DEV_PROXY_IMAGE_DIGEST }}
          HTTPS_ACTIVE: ${{ vars.DEV_HTTPS_ACTIVE }}
          IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
          IAP_BACKEND_SERVICE_ID: ${{ vars.DEV_IAP_BACKEND_SERVICE_ID }}
        run: |
          set -euo pipefail
          iap_args=(--set iap.enabled=false)
          if [[ "$HTTPS_ACTIVE" == 'true' ]]; then
            audience="/projects/260283083469/global/backendServices/${IAP_BACKEND_SERVICE_ID}"
            iap_args=(--set iap.enabled=true --set-string "iap.expectedAudience=$audience" --set-string "iap.allowedEmail=$IAP_ALLOWED_EMAIL")
          fi
          helm upgrade --install helpdesk helm/helpdesk -n "$NAMESPACE" -f helm/helpdesk/values-dev.yaml -f helm/helpdesk/values-dev-delivery.yaml \
            --set-string image.digest="$APP_DIGEST" --set-string cloudSqlProxy.image.digest="$PROXY_DIGEST" \
            "${iap_args[@]}" \
            --wait --timeout 10m
          kubectl rollout status deployment/helpdesk-helpdesk -n "$NAMESPACE" --timeout=5m
          kubectl get deployment helpdesk-helpdesk -n "$NAMESPACE" -o json | jq -e \
            '.spec.replicas == 2 and .status.readyReplicas == 2 and .status.availableReplicas == 2' >/dev/null
          kubectl get service helpdesk-helpdesk -n "$NAMESPACE" -o json | jq -e '.spec.type == "ClusterIP"' >/dev/null
      - name: Smoke test via localhost-only port-forward
        run: |
          set -euo pipefail
          kubectl port-forward --address 127.0.0.1 -n "$NAMESPACE" service/helpdesk-helpdesk 18080:80 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/health/live >/dev/null && \
               curl -fsS --max-time 3 http://127.0.0.1:18080/health/ready >/dev/null; then
              echo 'Both health endpoints passed through the internal Service.'
              exit 0
            fi
            sleep 2
          done
          echo '::error::Application health checks did not pass.'
          exit 1
      - name: Record reviewed release
        env:
          APP_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Image: ${IMAGE_REPOSITORY}@${APP_DIGEST}"
            echo "Helm revision: $(helm history helpdesk -n "$NAMESPACE" -o json | jq -r '.[-1].revision')"
            echo 'Dev Deployment: 2 ready replicas, internal ClusterIP, health checks passed.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional manual route-stage operation; reconcile the separate HTTPS edge release without rebuilding the app.
  https-edge:
    name: Separately approved HTTPS edge stage
    if: github.repository == 'mhachem110/HelpDeskCloud-App' && github.ref == 'refs/heads/dev' && github.event_name == 'workflow_dispatch' && inputs.https_stage != 'none'
    environment: dev-app-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      HTTPS_STAGE: ${{ inputs.https_stage }}
      HTTPS_EDGE_ENABLED: ${{ vars.DEV_HTTPS_EDGE_ENABLED }}
      HTTPS_ACTIVE: ${{ vars.DEV_HTTPS_ACTIVE }}
      HTTPS_HOSTNAME: ${{ vars.DEV_HTTPS_HOSTNAME }}
      HTTPS_CERTIFICATE_MAP: ${{ vars.DEV_HTTPS_CERTIFICATE_MAP }}
      HTTPS_STATIC_IP_NAME: ${{ vars.DEV_HTTPS_STATIC_IP_NAME }}
      HTTPS_SSL_POLICY: ${{ vars.DEV_HTTPS_SSL_POLICY }}
      HTTPS_STATIC_IP: ${{ vars.DEV_HTTPS_STATIC_IP }}
      IAP_OAUTH_CLIENT_ID: ${{ vars.DEV_IAP_OAUTH_CLIENT_ID }}
      IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
      IAP_BACKEND_SERVICE_ID: ${{ vars.DEV_IAP_BACKEND_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Verify protected deployment Environment before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT: dev-app-deploy
        run: bash .github/scripts/verify-dev-environment.sh
      - name: Require owner-configured HTTPS prerequisites
        env:
          CONFIRM_APPLICATION_ROUTE: ${{ inputs.confirm_application_route }}
        run: |
          set -euo pipefail
          [[ "$HTTPS_EDGE_ENABLED" == 'true' ]] || { echo '::error::HTTPS edge rollout is disabled. Set DEV_HTTPS_EDGE_ENABLED only after domain, certificate, OAuth and cost review.'; exit 1; }
          [[ "$HTTPS_HOSTNAME" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]] || { echo '::error::Set the owner-controlled DEV_HTTPS_HOSTNAME.'; exit 1; }
          [[ "$HTTPS_CERTIFICATE_MAP" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
          [[ "$HTTPS_STATIC_IP_NAME" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
          [[ "$HTTPS_SSL_POLICY" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
          [[ "$HTTPS_STATIC_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          [[ "$IAP_OAUTH_CLIENT_ID" =~ ^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$ ]]
          if [[ "$HTTPS_STAGE" == 'application' ]]; then
            [[ "$HTTPS_ACTIVE" == 'true' ]] || { echo '::error::Application routing requires DEV_HTTPS_ACTIVE=true and a separately successful signed-IAP app deployment.'; exit 1; }
            [[ "$CONFIRM_APPLICATION_ROUTE" == 'true' ]] || { echo '::error::Confirm the IAP backend user grant and signed-assertion tests before expanding the route.'; exit 1; }
            [[ "$IAP_BACKEND_SERVICE_ID" =~ ^[0-9]+$ ]]
            [[ "$IAP_ALLOWED_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]
          elif [[ "$HTTPS_STAGE" != 'health-only' ]]; then
            echo '::error::Unknown HTTPS stage.'
            exit 1
          fi
      - name: Render and validate the exact HTTPS route stage
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          helm lint helm/https-edge-access \
            --set enabled=true --set-string "stage=$HTTPS_STAGE" --set-string "hostname=$HTTPS_HOSTNAME" \
            --set-string "certificateMap=$HTTPS_CERTIFICATE_MAP" --set-string "staticIpName=$HTTPS_STATIC_IP_NAME" \
            --set-string "sslPolicyName=$HTTPS_SSL_POLICY" --set-string "oauthClientId=$IAP_OAUTH_CLIENT_ID"
          helm template helpdesk-edge helm/https-edge-access -n "$NAMESPACE" \
            --set enabled=true --set-string "stage=$HTTPS_STAGE" --set-string "hostname=$HTTPS_HOSTNAME" \
            --set-string "certificateMap=$HTTPS_CERTIFICATE_MAP" --set-string "staticIpName=$HTTPS_STATIC_IP_NAME" \
            --set-string "sslPolicyName=$HTTPS_SSL_POLICY" --set-string "oauthClientId=$IAP_OAUTH_CLIENT_ID" \
            > "$RUNNER_TEMP/helpdesk-edge.yaml"
          python .github/scripts/check-https-edge.py "$RUNNER_TEMP/helpdesk-edge.yaml" \
            "$HTTPS_STAGE" "$HTTPS_HOSTNAME" "$HTTPS_CERTIFICATE_MAP" "$HTTPS_STATIC_IP_NAME" \
            "$HTTPS_SSL_POLICY" "$IAP_OAUTH_CLIENT_ID"
      - uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-app-deploy-dev
          service_account: helpdesk-app-deployer-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          cluster_name: helpdeskcloud-dev-gke
          location: us-east1
          use_dns_based_endpoint: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@v4
      - name: Confirm existing private app and validate the API server manifest
        env:
          CONFIRM_APPLICATION_ROUTE: ${{ inputs.confirm_application_route }}
        run: |
          set -euo pipefail
          test "$(kubectl config current-context)" = "gke_${PROJECT_ID}_${REGION}_${CLUSTER}"
          kubectl get deployment helpdesk-helpdesk -n "$NAMESPACE" -o json | jq -e \
            '.spec.replicas == 2 and .status.readyReplicas == 2 and .status.availableReplicas == 2' >/dev/null
          kubectl get service helpdesk-helpdesk -n "$NAMESPACE" -o json | jq -e '.spec.type == "ClusterIP"' >/dev/null
          if [[ "$HTTPS_STAGE" == 'application' ]]; then
            audience="/projects/260283083469/global/backendServices/${IAP_BACKEND_SERVICE_ID}"
            kubectl get deployment helpdesk-helpdesk -n "$NAMESPACE" -o json | jq -e \
              --arg audience "$audience" --arg email "$IAP_ALLOWED_EMAIL" \
              '([.spec.template.spec.containers[] | select(.name == "helpdesk") | .env[]? | select(.name == "Iap__Enabled" and .value == "true")] | length) == 1 and
               ([.spec.template.spec.containers[] | select(.name == "helpdesk") | .env[]? | select(.name == "Iap__ExpectedAudience" and .value == $audience)] | length) == 1 and
               ([.spec.template.spec.containers[] | select(.name == "helpdesk") | .env[]? | select(.name == "Iap__AllowedEmail" and (.value | ascii_downcase) == ($email | ascii_downcase))] | length) == 1' >/dev/null || {
                echo '::error::The running app is not enforcing IAP assertions for this exact backend and account.'
                exit 1
              }
          fi
          kubectl apply --dry-run=server -n "$NAMESPACE" -f "$RUNNER_TEMP/helpdesk-edge.yaml" >/dev/null
      - name: Deliver the OAuth secret without exposing it in logs or Helm values
        env:
          IAP_OAUTH_CLIENT_SECRET: ${{ secrets.DEV_IAP_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$IAP_OAUTH_CLIENT_SECRET" ]] || { echo '::error::Set the dev-app-deploy Environment secret DEV_IAP_OAUTH_CLIENT_SECRET.'; exit 1; }
          umask 077
          secret_file="$RUNNER_TEMP/iap-oauth-client-secret"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s' "$IAP_OAUTH_CLIENT_SECRET" > "$secret_file"
          kubectl create secret generic helpdesk-iap-oauth -n "$NAMESPACE" \
            --from-file=key="$secret_file" --dry-run=client -o yaml |
            kubectl apply --server-side --field-manager=helpdesk-iap-secret-delivery -f - >/dev/null
      - name: Reconcile the separate HTTPS edge release
        run: |
          set -euo pipefail
          helm upgrade --install helpdesk-edge helm/https-edge-access -n "$NAMESPACE" \
            --set enabled=true --set-string "stage=$HTTPS_STAGE" --set-string "hostname=$HTTPS_HOSTNAME" \
            --set-string "certificateMap=$HTTPS_CERTIFICATE_MAP" --set-string "staticIpName=$HTTPS_STATIC_IP_NAME" \
            --set-string "sslPolicyName=$HTTPS_SSL_POLICY" --set-string "oauthClientId=$IAP_OAUTH_CLIENT_ID" \
            --wait --timeout 10m
          # Kubernetes conditions prove the controller accepted the objects; the external probes below
          # separately wait for Google's load balancer to serve every newly configured app path.
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            gateway_ok=$(kubectl get gateway helpdesk-dev-https -n "$NAMESPACE" -o json | jq -r 'any(.status.conditions[]?; .type == "Programmed" and .status == "True")')
            route_ok=$(kubectl get httproute helpdesk-dev-https -n "$NAMESPACE" -o json | jq -r 'any(.status.parents[]?.conditions[]?; .type == "Accepted" and .status == "True") and any(.status.parents[]?.conditions[]?; .type == "ResolvedRefs" and .status == "True")')
            backend_ok=$(kubectl get gcpbackendpolicy helpdesk-dev-iap -n "$NAMESPACE" -o json | jq -r 'any(.status.conditions[]?; .type == "Attached" and .status == "True")')
            health_ok=$(kubectl get healthcheckpolicy helpdesk-dev-healthcheck -n "$NAMESPACE" -o json | jq -r 'any(.status.conditions[]?; .type == "Attached" and .status == "True")')
            if [[ "$gateway_ok" == true && "$route_ok" == true && "$backend_ok" == true && "$health_ok" == true ]]; then break; fi
            sleep 15
          done
          [[ "${gateway_ok:-false}" == true && "${route_ok:-false}" == true && "${backend_ok:-false}" == true && "${health_ok:-false}" == true ]] || {
            kubectl describe gateway helpdesk-dev-https -n "$NAMESPACE" || true
            kubectl describe httproute helpdesk-dev-https -n "$NAMESPACE" || true
            kubectl describe gcpbackendpolicy helpdesk-dev-iap -n "$NAMESPACE" || true
            kubectl describe healthcheckpolicy helpdesk-dev-healthcheck -n "$NAMESPACE" || true
            echo '::error::GKE Gateway or required security policy did not become ready.'
            exit 1
          }
          gateway_ip=$(kubectl get gateway helpdesk-dev-https -n "$NAMESPACE" -o json | jq -r '.status.addresses[]?.value | select(test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$"))' | head -n1)
          [[ -n "$gateway_ip" ]] || { echo '::error::Gateway has no external IPv4 address.'; exit 1; }
          [[ "$gateway_ip" == "$HTTPS_STATIC_IP" ]] || { echo '::error::Gateway address does not match the retained Terraform static IP.'; exit 1; }
          probe_paths=(/health/live)
          if [[ "$HTTPS_STAGE" == 'application' ]]; then
            probe_paths=(/ /api/tickets /health/live)
          fi
          declare -A probe_ok=()
          declare -A probe_result=()
          declare -A probe_code=()
          declare -A probe_header_file=()
          declare -A probe_error_file=()
          probe_deadline=$((SECONDS + 600))
          while (( SECONDS < probe_deadline )); do
            pending=false
            for path in "${probe_paths[@]}"; do
              [[ "${probe_ok[$path]:-false}" == true ]] && continue
              case "$path" in
                /) label=root ;;
                /api/tickets) label=api-tickets ;;
                /health/live) label=health-live ;;
                *) label=path ;;
              esac
              header_file="$RUNNER_TEMP/iap-${label}.headers"
              error_file="$RUNNER_TEMP/iap-${label}.stderr"
              probe_header_file[$path]="$header_file"
              probe_error_file[$path]="$error_file"
              if code=$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header "$header_file" \
                --write-out '%{http_code}' --resolve "${HTTPS_HOSTNAME}:443:${gateway_ip}" \
                "https://${HTTPS_HOSTNAME}${path}" 2>"$error_file"); then
                probe_code[$path]="$code"
                if result=$(python .github/scripts/check-https-edge.py --check-iap-response \
                  "$code" "$header_file" "$IAP_OAUTH_CLIENT_ID" 2>/dev/null); then
                  probe_ok[$path]=true
                  probe_result[$path]="$result"
                  continue
                fi
              else
                probe_code[$path]="curl failed"
              fi
              pending=true
            done
            [[ "$pending" == false ]] && break
            sleep 15
          done
          for path in "${probe_paths[@]}"; do
            if [[ "${probe_ok[$path]:-false}" != true ]]; then
              if [[ -n "${probe_code[$path]:-}" && -f "${probe_header_file[$path]:-}" ]]; then
                python .github/scripts/check-https-edge.py --check-iap-response \
                  "${probe_code[$path]}" "${probe_header_file[$path]}" "$IAP_OAUTH_CLIENT_ID" || true
              elif [[ -s "${probe_error_file[$path]:-}" ]]; then
                cat "${probe_error_file[$path]}"
              fi
              echo "::error::Anonymous HTTPS request to ${path} did not reach the expected IAP denial within the 10-minute frontend readiness window (latest result: ${probe_code[$path]:-no response})."
              exit 1
            fi
          done

          kubectl get deployment helpdesk-helpdesk -n "$NAMESPACE" -o json | jq -e \
            '.spec.replicas == 2 and .status.readyReplicas == 2 and .status.availableReplicas == 2' >/dev/null
          kubectl get service helpdesk-helpdesk -n "$NAMESPACE" -o json | jq -e '.spec.type == "ClusterIP"' >/dev/null
          kubectl get gcpbackendpolicy helpdesk-dev-iap -n "$NAMESPACE" -o json | jq -e \
            --arg client "$IAP_OAUTH_CLIENT_ID" \
            '.spec.default.iap.enabled == true and .spec.default.iap.clientID == $client and
             any(.status.conditions[]?; .type == "Attached" and .status == "True")' >/dev/null
          helm_revision=$(helm history helpdesk-edge -n "$NAMESPACE" -o json | jq -r '.[-1].revision')
          ready_replicas=$(kubectl get deployment helpdesk-helpdesk -n "$NAMESPACE" -o json | jq -r '"\(.status.readyReplicas // 0)/\(.spec.replicas)"')
          {
            echo '## HTTPS edge deployment verified'
            echo "- Stage: ${HTTPS_STAGE}"
            echo "- Hostname: ${HTTPS_HOSTNAME}"
            echo "- Gateway: Programmed=True at ${gateway_ip} (controller status and external load-balancer probes passed)"
            echo "- Helm release revision: ${helm_revision}"
            echo "- IAP backend policy: enabled and Attached=True"
            echo "- Application replicas: ${ready_replicas} Ready; Service type is ClusterIP"
            if [[ "$HTTPS_STAGE" == 'application' ]]; then
              echo "- Application JWT audience: GKE backend service ID ${IAP_BACKEND_SERVICE_ID}"
            fi
            echo '- Anonymous request checks:'
            for path in "${probe_paths[@]}"; do echo "  - ${path}: ${probe_result[$path]}"; done
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failed HTTPS edge delivery
        if: failure()
        env:
          STAGE: ${{ inputs.https_stage }}
          HOSTNAME: ${{ vars.DEV_HTTPS_HOSTNAME }}
        run: |
          {
            echo '## HTTPS edge deployment failed'
            echo "- Stage: ${STAGE}"
            echo "- Hostname: ${HOSTNAME}"
            echo '- Review the failed step for the sanitized Gateway, IAP, TLS or anonymous-request check.'
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
