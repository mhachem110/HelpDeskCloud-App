{{- if .Values.application.enabled }}
{{- if and .Values.database.connectionFile.enabled (ne .Values.service.type "ClusterIP") }}
{{- fail "Dev application Service must remain ClusterIP" }}
{{- end }}
apiVersion: v1
kind: Service
# ClusterIP keeps the application reachable only from the in-cluster Gateway.
metadata:
  name: {{ include "helpdesk.fullname" . }}
  labels:
    app.kubernetes.io/name: helpdesk
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: helpdesk
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
{{- end }}
