apiVersion: v1
kind: Service
metadata:
  name: {{ include "helpdesk.fullname" . }}
  labels:
    app.kubernetes.io/name: helpdesk
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: helpdesk
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
