{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helpdesk.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: helpdesk
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.migration.serviceAccountName }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.migration.serviceAccountName | quote }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.migration.gcpServiceAccount | quote }}
automountServiceAccountToken: true
{{- end }}
