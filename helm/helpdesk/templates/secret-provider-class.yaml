{{- if and .Values.platformBootstrap.enabled .Values.database.connectionFile.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.database.connectionFile.providerClass | quote }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: {{ required "application Secret Manager resource required" .Values.database.connectionFile.resourceName | quote }}
        path: db-connection
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.migration.providerClass | quote }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: {{ required "migration Secret Manager resource required" .Values.migration.adminSecretResourceName | quote }}
        path: admin-password
{{- end }}
