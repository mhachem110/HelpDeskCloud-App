replicaCount: 2
image:
  repository: "" # Set to Artifact Registry path during deployment
  tag: "1.0.0"
  digest: "" # Prefer an immutable sha256 digest supplied by the release workflow
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
# This Secret is NOT managed by the Helm chart. Infrastructure/secret delivery creates it.
database:
  secretName: helpdesk-db
  secretKey: connectionString
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
podAnnotations: {}
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false
