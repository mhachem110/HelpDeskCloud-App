name: helpdeskcloud
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - helpdesk_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=helpdesk;Username=helpdesk;Password=${POSTGRES_PASSWORD};Pooling=true"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
volumes:
  helpdesk_data:
networks:
  internal: {}

